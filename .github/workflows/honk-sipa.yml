name: Honk F50 SIPA adaptation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: Honk SIPA ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [test, build]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout F50 build definitions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout fixed Honk source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Glassyiris/honk
          ref: eac5e0c5fba5078a7ff4517a3e3851e7fa0f4f8e
          path: honk-source
          persist-credentials: false
      - name: Install pinned host Rust and cross target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt
          targets: aarch64-unknown-linux-musl
      - name: Install pinned eBPF Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-07-20
          components: rust-src, llvm-tools
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Cache Cargo downloads and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: f50-sipa-${{ matrix.mode }}
          cache-on-failure: true
          workspaces: |
            honk-source -> target
            honk-source/crates/honk-ebpf -> target
      - name: Install native build and ELF inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev zstd qemu-user
      - name: Apply adaptation and verify pinned embedded assets
        run: bash honk-sipa-build/prepare.sh "$PWD/honk-source" "$PWD/artifacts"
      - name: Compile and verify selected lane
        run: bash honk-sipa-build/build.sh "$PWD/honk-source" "$PWD/artifacts" '${{ matrix.mode }}'
      - name: Upload real build and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: honk-f50-sipa-${{ matrix.mode }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
